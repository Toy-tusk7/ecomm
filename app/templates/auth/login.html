{% extends 'base.html' %}

{% block title %}Login - Obsidian Store{% endblock %}

{% block content %}
<div class="form-card">
    <h2 class="form-title">Welcome Back</h2>
    <p class="form-subtitle">Enter your credentials to access your secure profile</p>
    
    <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        
        <div class="form-group form-check" style="margin-top: 15px;">
            <input type="checkbox" id="remember" name="remember" style="accent-color: var(--accent-indigo);">
            <label for="remember">Keep me logged in</label>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
            Sign In
        </button>
    </form>
    
    <div class="form-footer">
        <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create Account</a></p>
    </div>
</div>
{% endblock %}
