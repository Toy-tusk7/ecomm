version: '3.8'

services:
  web:
    build: .
    container_name: ecomm_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=obsidian-store-super-secret-key-1298471209
      - DATABASE_URL=sqlite:///database.db
      - PORT=5000
    volumes:
      - db_data:/workspace/instance
      - uploads_data:/workspace/app/static/uploads

volumes:
  db_data:
  uploads_data:
